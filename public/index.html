<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Fayzobod ko&#39;chasi — jonli 3D</title>
  <style>
    :root {
      --glass: rgba(12, 16, 21, .62);
      --glass2: rgba(16, 22, 28, .86);
      --line: rgba(255, 255, 255, .13);
      --fg: #eef2f4;
      --mut: #9fb0b9;
      --acc: #f2b84b;
      --red: #ff453a;
      --t: env(safe-area-inset-top);
      --b: env(safe-area-inset-bottom);
      --l: env(safe-area-inset-left);
      --r: env(safe-area-inset-right)
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #0b0d10;
      overflow: hidden;
      color: var(--fg);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    .gl {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px)
    }

    #noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px)
    }

    #corners {
      position: fixed;
      inset: calc(var(--t) + 4px) 6px calc(var(--b) + 58px) 6px;
      pointer-events: none;
      display: none
    }

    #corners i {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .55)
    }

    #corners i:nth-child(1) {
      left: 0;
      top: 0;
      border-right: 0;
      border-bottom: 0
    }

    #corners i:nth-child(2) {
      right: 0;
      top: 0;
      border-left: 0;
      border-bottom: 0
    }

    #corners i:nth-child(3) {
      left: 0;
      bottom: 0;
      border-right: 0;
      border-top: 0
    }

    #corners i:nth-child(4) {
      right: 0;
      bottom: 0;
      border-left: 0;
      border-top: 0
    }

    /* tepa: kamera nomi (chap) · vaqt/ob-havo (o'ng) */
    #top {
      position: fixed;
      left: calc(var(--l) + 8px);
      right: calc(var(--r) + 8px);
      top: calc(var(--t) + 8px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
      z-index: 5
    }

    #top>* {
      pointer-events: auto
    }

    #camchip {
      padding: 5px 10px;
      font-weight: 600;
      max-width: 60vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    #camchip small {
      display: block;
      font-weight: 400;
      color: var(--mut);
      font-size: 11px
    }

    #rec {
      color: var(--red)
    }

    #clock {
      padding: 5px 10px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--line)
    }

    #clock b {
      font-size: 15px
    }

    #clock small {
      display: block;
      color: var(--mut);
      font-size: 11px
    }

    /* ID karta */
    #idc {
      position: fixed;
      right: calc(var(--r, 0px) + 6px);
      bottom: calc(var(--b, 0px) + 74px);
      width: min(228px, 58vw);
      max-height: 38vh;
      overflow: auto;
      padding: 7px 8px;
      font-size: 11.5px;
      z-index: 6;
      display: none;
      background: rgba(12, 16, 21, .55)
    }

    #idc .hd {
      display: flex;
      gap: 9px;
      align-items: center
    }

    #idc .av {
      width: 28px;
      height: 28px;
      font-size: 11px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #111
    }

    #idc .nm {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2
    }

    #idc .sub {
      color: var(--mut);
      font-size: 11.5px
    }

    #idc .x {
      margin-left: auto;
      align-self: flex-start;
      background: none;
      border: 0;
      font-size: 18px;
      color: var(--mut);
      padding: 0 2px
    }

    #idc .row {
      margin-top: 7px;
      font-size: 12.5px
    }

    #idc .row b {
      color: var(--acc);
      font-weight: 600
    }

    #idc .why {
      color: #cfe0e6;
      font-style: italic;
      font-size: 12px;
      margin-top: 3px
    }

    #idc .tabs {
      display: flex;
      gap: 4px;
      margin-top: 9px;
      flex-wrap: wrap
    }

    #idc .tabs button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11.5px
    }

    #idc .tabs button.on {
      background: var(--acc);
      color: #1b1408;
      border-color: var(--acc)
    }

    #idc .pane {
      margin-top: 7px;
      font-size: 12px
    }

    #idc .pane div.it {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .07)
    }

    #idc .pane a {
      color: #9fd3ff;
      text-decoration: none
    }

    #idc .pane .now {
      color: var(--acc)
    }

    #idc .acts {
      display: flex;
      gap: 6px;
      margin-top: 8px
    }

    #idc .acts button {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .07);
      border-radius: 8px;
      padding: 6px 4px;
      font-size: 12px
    }

    /* pastki panel */
    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 6px calc(var(--r) + 6px) calc(var(--b) + 6px) calc(var(--l) + 6px);
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 5;
      background: linear-gradient(transparent, rgba(0, 0, 0, .55) 40%)
    }

    #bar::-webkit-scrollbar {
      display: none
    }

    #bar button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--glass2);
      border-radius: 10px;
      padding: 6px 10px;
      min-height: 40px;
      font-weight: 600;
      font-size: 12.5px;
      line-height: 1.15
    }

    #bar button small {
      display: block;
      font-weight: 400;
      font-size: 10px;
      color: var(--mut)
    }

    #bar button.on {
      background: var(--fg);
      color: #0b0d10
    }

    #bar button.on small {
      color: #333
    }

    #bar .sep {
      flex: 0 0 1px;
      background: var(--line);
      margin: 4px 2px
    }

    /* xarita */
    #mapw {
      position: fixed;
      right: calc(var(--r) + 8px);
      bottom: calc(var(--b) + 60px);
      z-index: 4
    }

    #map {
      width: 128px;
      height: 128px;
      border-radius: 12px;
      display: block;
      touch-action: none
    }

    #mapw.min #map {
      width: 44px;
      height: 44px
    }

    /* suhbat qatori */
    #ticker {
      position: fixed;
      left: calc(var(--l) + 8px);
      bottom: calc(var(--b) + 60px);
      max-width: min(60vw, 420px);
      padding: 6px 10px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .5s;
      pointer-events: none;
      z-index: 4
    }

    #ticker b {
      color: var(--acc)
    }

    /* pufakchalar */
    #bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden
    }

    .bub {
      position: absolute;
      transform: translate(-50%, -100%);
      max-width: 170px;
      padding: 5px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .93);
      color: #111;
      font-size: 11.5px;
      line-height: 1.3;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3)
    }

    .bub:after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      margin-left: -5px;
      border: 5px solid transparent;
      border-top-color: rgba(255, 255, 255, .93);
      border-bottom: 0
    }

    .bub i {
      display: block;
      font-style: normal;
      font-weight: 700;
      font-size: 10px;
      color: #a05a00
    }

    .tag {
      position: absolute;
      transform: translate(-50%, -100%);
      padding: 2px 7px;
      border-radius: 8px;
      background: var(--acc);
      color: #1b1408;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap
    }

    /* varaqlar */
    .sheet {
      position: fixed;
      left: calc(var(--l) + 8px);
      right: calc(var(--r) + 8px);
      bottom: calc(var(--b) + 60px);
      max-width: 420px;
      margin: 0 auto;
      max-height: 56vh;
      overflow: auto;
      padding: 10px 12px;
      z-index: 7;
      display: none;
      background: var(--glass2)
    }

    .sheet h3 {
      margin: 2px 0 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .sheet h3 button {
      background: none;
      border: 0;
      font-size: 18px;
      color: var(--mut)
    }

    .fam {
      margin-bottom: 9px
    }

    .fam b {
      display: block;
      color: var(--acc);
      font-size: 12px;
      margin-bottom: 3px
    }

    .fam button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      border-radius: 8px;
      padding: 4px 7px;
      margin: 0 4px 4px 0;
      font-size: 12px
    }

    .fam button i {
      font-style: normal;
      font-size: 10px;
      margin-left: 3px
    }

    .seg {
      display: flex;
      gap: 4px;
      margin: 6px 0 10px;
      flex-wrap: wrap
    }

    .seg button {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      border-radius: 8px;
      padding: 7px 4px;
      font-size: 12px;
      min-width: 56px
    }

    .seg button.on {
      background: var(--acc);
      color: #1b1408;
      border-color: var(--acc)
    }

    .sheet label {
      display: block;
      margin-top: 6px;
      color: var(--mut);
      font-size: 12px
    }

    .sheet input[type=range] {
      width: 100%;
      accent-color: var(--acc)
    }

    #photo {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--b) + 60px);
      width: min(64vw, 300px);
      padding: 5px 10px;
      font-size: 11.5px;
      display: none;
      z-index: 4
    }

    #photo input {
      width: 100%;
      accent-color: var(--acc)
    }

    #povnav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(var(--t) + 52px);
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      z-index: 5
    }
    #povnav b {
      min-width: 90px;
      text-align: center
    }
    #povnav button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .07);
      border-radius: 8px;
      padding: 5px 10px
    }
    #walkpad {
      position: fixed;
      left: 12px;
      bottom: 84px;
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
      z-index: 5;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none
    }
    #walkpad button {
      border: 1px solid var(--line);
      background: rgba(20, 24, 30, .55);
      color: #fff;
      border-radius: 12px;
      font-size: 20px;
      touch-action: none;
      backdrop-filter: blur(6px)
    }
    #walkpad button.on {
      background: rgba(255, 255, 255, .25)
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d10;
      font-size: 14px;
      text-align: center;
      padding: 24px;
      z-index: 20
    }

    #idc .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 5px
    }

    #idc .tabs button {
      padding: 3px 6px;
      font-size: 10.5px
    }

    #idc .nm {
      font-size: 12.5px
    }

    #idc .sub {
      font-size: 10px
    }

    #idc .it {
      font-size: 11px;
      line-height: 1.35
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="noise"></div>
  <div id="corners"><i></i><i></i><i></i><i></i></div>
  <div id="bubbles"></div>
  <div id="top">
    <div id="camchip" class="gl"><span id="rec">● </span><span id="camname"></span><small id="camsub"></small></div>
    <button id="clock" class="gl"><b id="clk">--:--</b><small id="wxl"></small></button>
  </div>
  <div id="walkpad"><span></span><button data-k="KeyW" aria-label="Oldinga">▲</button><span></span><button data-k="ArrowLeft" aria-label="Chapga burilish">◀</button><button data-k="KeyS" aria-label="Orqaga">▼</button><button data-k="ArrowRight" aria-label="O'ngga burilish">▶</button></div>
  <div id="povnav" class="gl"><button onclick="window.__povStep(-1)">◀</button><b id="povname"></b><button onclick="window.__povStep(1)">▶</button><button onclick="window.__povExit()" title="Chiqish">×</button></div>
  <div id="idc" class="gl"></div>
  <div id="ticker" class="gl"></div>
  <div id="photo" class="gl">Asl rasm: <b id="pv">0%</b><input id="pslider" type="range" min="0" max="100" value="0">
  </div>
  <div id="mapw"><canvas id="map" width="256" height="256" class="gl"></canvas></div>
  <div id="people" class="sheet gl"></div>
  <div id="settings" class="sheet gl"></div>
  <div id="bar"></div>
  <div id="loading">Fayzobod ko'chasi yuklanmoqda…</div>
  <script>
    window.addEventListener('error', function (e) { var l = document.getElementById('loading'); if (l && l.style.display !== 'none') l.textContent = 'Xatolik: ' + (e.message || '3D kutubxona yuklanmadi'); });
    setTimeout(function () { var l = document.getElementById('loading'); if (l && l.style.display !== 'none' && !window.__ok) l.textContent = '3D kutubxona yuklanmadi. Internetni tekshirib, sahifani qayta oching.'; }, 15000);
  </script>

      if (ball.visible) { const P = BALL.ppos || BALL.pos; ball.position.set(lerp(P.x, BALL.pos.x, al), 0.11 + Math.abs(Math.sin(BALL.t * 2)) * 0.15, lerp(P.z, BALL.pos.z, al)); ball.rotation.x = BALL.spin || 0; }
    }
    let lastT = performance.now(), idAcc = 0, frames = 0, dayNow = 0;
    function loop(t) {
      requestAnimationFrame(loop);
      const dtR = Math.min(0.1, (t - lastT) / 1000); lastT = t; idAcc += dtR;
      const target = Math.floor(netNow() / STEP_MS); let n = 0;
      FF = target - stepN > 25;
      while (stepN < target && n < 20000) { if (dayOf(stepN + 1) !== dayNow) { location.reload(); return; } simStep(); n++; }
      FF = false;
      drawSim(Math.max(0, Math.min(1, (netNow() - stepN * STEP_MS) / STEP_MS)));
      updateEnv(dtR); updateRain(dtR);
      if (mode === 'pov') povCam(dtR); else if (mode === 'walk') { inRoom = null; roomLight.intensity = 0; if (roomShown.size) clearRoomShown(); if (povHid) { if (povHid.mesh) povHid.mesh.inner.visible = true; povHid = null; } walkCam(dtR); } else { inRoom = null; roomLight.intensity = 0; if (roomShown.size) clearRoomShown(); if (povHid) { if (povHid.mesh) povHid.mesh.inner.visible = true; povHid = null; } applyLook(); }
      sky.position.copy(camera.position); if (inRoom) rain.visible = false;
      if (SEL) { const a = A(SEL); selRing.visible = !!(a.mesh && !a.hidden) && !(mode === 'pov' && povId === SEL); if (selRing.visible) selRing.position.set(a.mesh.g.position.x, 0.03, a.mesh.g.position.z); } else selRing.visible = false;
      const on = (t / 1000 % 1.2) < 0.6; CAMS.forEach(c => c.led.visible = on); $('rec').style.opacity = on ? 1 : 0.3;
      if (mode === 'cam') { postMat.uniforms.time.value = t / 1000; renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); }
      else renderer.render(scene, camera);
      drawOverlays(); drawMap(); hudUpdate(false);
      if (idAcc > 0.7) { idAcc = 0; renderID(); renderPeople(); }
      if (++frames === 2) { $('loading').style.display = 'none'; }
    }
    (async function boot() {
      window.__ok = true; $('loading').textContent = 'Vaqt sinxronlanmoqda…';
      await syncClock();
      // bugungi kun Toshkent yarim tunidan boshlab qayta tiklanadi — hamma tomoshabin bir xil holatni ko'radi
      const day0 = Math.floor((netNow() + TZ) / 864e5) * 864e5; dayNow = day0 / 864e5;
      stepN = (day0 - TZ) / STEP_MS; simMs = day0; reseed(stepN);
      rollWeather(true);
    {
        curDay = Math.floor(simMs / 864e5); const m = minOfDay();
        PEOPLE.forEach(p => { const a = A(p.id); a.tasks = planDay(a); a.tasks.forEach(t => { t.done = t.t1 < m ? 1 : 0; }); });
        PEOPLE.forEach(p => {
          const a = A(p.id); if (p.abroad) return; const t = a.tasks.find(t => !t.done && t.t0 <= m && t.t1 > m && t.type === 'away');
          if (t && !a.leader) {
            t.done = 1; a.task = t; a.thought = t.why; a.now = t.label; a.st = t.ride ? 'riding' : 'away'; show(a, false);
            if (t.car) { const C = CARS[t.car]; C.state = 'away'; C.obj.visible = false; (t.pax || []).forEach(id => { const c = A(id); const ct = c.tasks.find(x => x.ride === p.id && !x.done); if (ct) { ct.done = 1; c.task = ct; c.st = 'riding'; show(c, false); c.now = ct.label; } }); }
            (t.with || []).forEach(id => { const c = A(id); c.st = 'away'; show(c, false); });
          }
        });
        if (A('P028').tasks.some(t => t.dropWith && t.t1 <= m) && m < 1000) { const c = A('P030'); c.st = 'away'; c.now = 'Bog\'chada'; show(c, false); }
      }
      tickSim();
      const __ff0 = performance.now(); const goal = () => Math.floor(netNow() / STEP_MS), total = Math.max(1, goal() - stepN); FF = true;
      while (stepN < goal()) {
        const t0 = performance.now();
        while (stepN < goal() && performance.now() - t0 < 60) { if (dayOf(stepN + 1) !== dayNow) { location.reload(); return; } simStep(); }
        $('loading').textContent = "Fayzobod ko'chasining bugungi hayoti tiklanmoqda… " + Math.min(100, Math.round(100 - (goal() - stepN) / total * 100)) + '%';
        await new Promise(r => setTimeout(r, 0));
      }
      FF = false; renderer.shadowMap.needsUpdate = true; hudUpdate(true); if (DBG) console.log('ff steps', total, 'ms', Math.round(performance.now() - __ff0));
      requestAnimationFrame(loop);
    })();

  </script>
